# Cerberus Watchtower repo registry.
#
# Repos are AUTO-DISCOVERED: every child git repository under each [[roots]]
# entry is registered automatically, with its stack inferred from contents
# (sln -> dotnet, package.json+vue -> vue, pyproject/requirements -> python,
# *.tf -> terraform, gradle -> android, else mixed).
#
# [overrides.<folder-name>] customizes a discovered repo: id (keep stable -
# snapshots and caches are keyed by it), name, stack, group, and include=true
# to register a non-git project directory.
#
# Roots for every machine live here together: a root that doesn't exist on the
# box you're running is skipped silently, so the same file works on the Windows
# desktop and the Mac. Overrides are keyed by folder name, not path, so they
# apply on both. Adding a machine = adding its roots below.

# --- Windows desktop ---

[[roots]]
path = 'C:\Users\aigor\_dev\_paytable'
group = "paytable"

[[roots]]
path = 'C:\Users\aigor\_dev\_cerberus'
group = "cerberus"

# --- Mac ---

[[roots]]
path = '/Users/aigorriera/_cerberus/_dev/payTable'
group = "paytable"

[[roots]]
path = '/Users/aigorriera/_cerberus/_dev'
group = "cerberus"

# Only child here that isn't underscore-prefixed is cerberus-claude-config,
# which sits a level above the _dev root on this machine.
[[roots]]
path = '/Users/aigorriera/_cerberus'
group = "cerberus"

# --- PayTable overrides (preserve original ids + display names) ---

[overrides.payTableDotnet]
id = "paytable-dotnet"
